syntax = "proto3";

package acme.accounts.v1;

import "acme/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service AccountsService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateDeposit(CreateDepositRequest) returns (CreateDepositResponse);
  // SettleDeposit is driven by the bank webhook. Idempotent on external_ref.
  rpc SettleDeposit(SettleDepositRequest) returns (SettleDepositResponse);

  // Card network messages. Idempotent on network_ref per message type.
  rpc Authorize(AuthorizeRequest) returns (AuthorizationResponse);
  rpc Capture(CaptureRequest) returns (AuthorizationResponse);
  rpc Reverse(ReverseRequest) returns (AuthorizationResponse);
  rpc Refund(RefundRequest) returns (RefundResponse);

  // Customer controls.
  rpc SetFrozen(SetFrozenRequest) returns (GetAccountResponse);
  rpc SetPurchaseLimit(SetPurchaseLimitRequest) returns (GetAccountResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // Customer repayments (Sprint 3).
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
  // SettlePayment is driven by the bank webhook (settled | failed). Idempotent on external_ref.
  rpc SettlePayment(SettlePaymentRequest) returns (PaymentResponse);
  // ReturnPayment is driven by the bank webhook within the return window. Idempotent on return_ref.
  rpc ReturnPayment(ReturnPaymentRequest) returns (PaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);

  // Billing support (Sprint 4).
  // AdvanceClock moves the account's simulated clock forward (dev only; gated at the gateway).
  rpc AdvanceClock(AdvanceClockRequest) returns (GetAccountResponse);
  // SetDelinquency sets none | past_due; charged_off is reached only through ChargeOff.
  rpc SetDelinquency(SetDelinquencyRequest) returns (GetAccountResponse);
  // ChargeOff applies collateral to the debt and blocks the card permanently. Idempotent.
  rpc ChargeOff(ChargeOffRequest) returns (GetAccountResponse);
  // CheckExposure restricts the card (over_limit) when holds + receivable exceed the limit.
  rpc CheckExposure(CheckExposureRequest) returns (GetAccountResponse);
  // ListAccountIDs pages through active and charged-off accounts for the billing sweep.
  rpc ListAccountIDs(ListAccountIDsRequest) returns (ListAccountIDsResponse);
}

message AdvanceClockRequest {
  string account_id = 1;
  int32 days = 2;
  acme.common.v1.RequestMeta meta = 3;
}
message SetDelinquencyRequest {
  string account_id = 1;
  string stage = 2;
  acme.common.v1.RequestMeta meta = 3;
}
message ChargeOffRequest {
  string account_id = 1;
  acme.common.v1.RequestMeta meta = 2;
}
message CheckExposureRequest {
  string account_id = 1;
  acme.common.v1.RequestMeta meta = 2;
}
message ListAccountIDsRequest {
  string after_id = 1;
  int32 limit = 2;
}
message ListAccountIDsResponse {
  repeated string ids = 1;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SETTLING = 2;
  PAYMENT_STATUS_SETTLED = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_EXPIRED = 5;
  PAYMENT_STATUS_RETURNING = 6;
  PAYMENT_STATUS_RETURNED = 7;
}

message Payment {
  string id = 1;
  string account_id = 2;
  acme.common.v1.Money amount = 3;
  PaymentStatus status = 4;
  string external_ref = 5;
  string return_ref = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp settled_at = 8;
  google.protobuf.Timestamp returned_at = 9;
  // received_at is account time at creation; billing judges on-time payments by it.
  google.protobuf.Timestamp received_at = 10;
  // settle_effective_at is the business date the settlement posts with (set at reserve).
  google.protobuf.Timestamp settle_effective_at = 11;
}

message PaymentResponse {
  Payment payment = 1;
  Account account = 2;
  bool replayed = 3;
}

message CreatePaymentRequest {
  string account_id = 1;
  int64 amount_minor = 2;
  acme.common.v1.RequestMeta meta = 3;
}

message SettlePaymentRequest {
  string payment_id = 1;
  string external_ref = 2;
  int64 amount_minor = 3;
  string currency = 4;
  PaymentStatus status = 5; // SETTLED or FAILED
  acme.common.v1.RequestMeta meta = 6;
}

message ReturnPaymentRequest {
  string payment_id = 1;
  string return_ref = 2;
  int64 amount_minor = 3;
  acme.common.v1.RequestMeta meta = 4;
}

message ListPaymentsRequest {
  string account_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_page_token = 2;
}

enum AuthorizationStatus {
  AUTHORIZATION_STATUS_UNSPECIFIED = 0;
  AUTHORIZATION_STATUS_APPROVED = 1;
  AUTHORIZATION_STATUS_DECLINED = 2;
  AUTHORIZATION_STATUS_CAPTURED = 3;
  AUTHORIZATION_STATUS_REVERSED = 4;
  AUTHORIZATION_STATUS_EXPIRED = 5;
  // Reserved; the ledger hold is being placed. Resolved within seconds or by the reconciler.
  AUTHORIZATION_STATUS_PENDING = 6;
  // The network never received an answer (lost response); any hold was released.
  AUTHORIZATION_STATUS_FAILED = 7;
}

message Merchant {
  string id = 1;
  string name = 2;
  string mcc = 3;
}

message Authorization {
  string id = 1;
  string account_id = 2;
  string network_ref = 3;
  acme.common.v1.Money amount = 4;
  Merchant merchant = 5;
  AuthorizationStatus status = 6;
  acme.common.v1.DeclineReason decline_reason = 7;
  int64 captured_amount_minor = 8;
  int64 refunded_amount_minor = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;
  google.protobuf.Timestamp captured_at = 12;
  google.protobuf.Timestamp reversed_at = 13;
}

message AuthorizeRequest {
  string network_ref = 1;
  string card_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  Merchant merchant = 5;
  acme.common.v1.RequestMeta meta = 6;
}
message AuthorizationResponse {
  Authorization authorization = 1;
  bool replayed = 2;
}

message CaptureRequest {
  string authorization_id = 1;
  string network_ref = 2;
  int64 amount_minor = 3;
  acme.common.v1.RequestMeta meta = 4;
}

message ReverseRequest {
  string authorization_id = 1;
  string network_ref = 2;
  acme.common.v1.RequestMeta meta = 3;
}

message Refund {
  string id = 1;
  string authorization_id = 2;
  string network_ref = 3;
  acme.common.v1.Money amount = 4;
  google.protobuf.Timestamp created_at = 5;
}
message RefundRequest {
  string authorization_id = 1;
  string network_ref = 2;
  int64 amount_minor = 3;
  acme.common.v1.RequestMeta meta = 4;
}
message RefundResponse {
  Refund refund = 1;
  Authorization authorization = 2;
  bool replayed = 3;
}

message SetFrozenRequest {
  string account_id = 1;
  bool frozen = 2;
  acme.common.v1.RequestMeta meta = 3;
}

message SetPurchaseLimitRequest {
  string account_id = 1;
  int64 purchase_limit_minor = 2;
  acme.common.v1.RequestMeta meta = 3;
}

message ListTransactionsRequest {
  string account_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListTransactionsResponse {
  repeated Authorization authorizations = 1;
  string next_page_token = 2;
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_PENDING_COLLATERAL = 1;
  ACCOUNT_STATE_ACTIVE = 2;
  ACCOUNT_STATE_CLOSED = 3;
}

enum DepositStatus {
  DEPOSIT_STATUS_UNSPECIFIED = 0;
  DEPOSIT_STATUS_PENDING = 1;
  DEPOSIT_STATUS_SETTLED = 2;
  DEPOSIT_STATUS_FAILED = 3;
}

message Account {
  string id = 1;
  string customer_id = 2;
  string currency = 3;
  AccountState state = 4;
  bool frozen = 5;
  int64 credit_limit_minor = 6;
  int64 available_credit_minor = 7;
  int64 collateral_minor = 8;
  int64 purchase_limit_minor = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Debt owed (max(receivable, 0)) and the customer's credit balance (max(-receivable, 0)).
  int64 outstanding_minor = 12;
  int64 credit_balance_minor = 13;
  // System restriction (e.g. "payment_returned"); empty when none.
  string restricted_reason = 14;
  // Sprint 4: account (simulated) time, activation time and delinquency stage (none | past_due | charged_off).
  google.protobuf.Timestamp account_time = 15;
  google.protobuf.Timestamp activated_at = 16;
  string delinquency = 17;
}

message Deposit {
  string id = 1;
  string account_id = 2;
  acme.common.v1.Money amount = 3;
  DepositStatus status = 4;
  string external_ref = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp settled_at = 7;
}

message CreateAccountRequest {
  string customer_id = 1;
  string currency = 2;
  acme.common.v1.RequestMeta meta = 3;
}
message CreateAccountResponse { Account account = 1; }

message GetAccountRequest { string account_id = 1; }
message GetAccountResponse { Account account = 1; }

message CreateDepositRequest {
  string account_id = 1;
  int64 amount_minor = 2;
  acme.common.v1.RequestMeta meta = 3;
}
message CreateDepositResponse { Deposit deposit = 1; }

message SettleDepositRequest {
  string deposit_id = 1;
  string external_ref = 2;
  int64 amount_minor = 3;
  string currency = 4;
  DepositStatus status = 5; // SETTLED or FAILED
  acme.common.v1.RequestMeta meta = 6;
}
message SettleDepositResponse {
  Deposit deposit = 1;
  Account account = 2;
  bool replayed = 3;
}
